name: Build LEDE x86-64 VMDK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build LEDE x86-64
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ack antlr3 asciidoc autoconf automake autopoint \
            binutils bison build-essential bzip2 ccache clang \
            cmake cpio curl device-tree-compiler flex gawk \
            gcc-multilib g++-multilib gettext git gperf haveged \
            help2man intltool libc6-dev-i386 libelf-dev libfuse-dev \
            libglib2.0-dev libgmp-dev libltdl-dev libmpc-dev \
            libmpfr-dev libncurses5-dev libncursesw5-dev \
            libpython3-dev libreadline-dev libssl-dev libtool \
            llvm lrzsz ninja-build p7zip p7zip-full patch pkgconf \
            python3 python3-pyelftools python3-setuptools qemu-utils \
            rsync scons squashfs-tools subversion swig texinfo \
            uglifyjs unzip vim wget xmlto xxd xz-utils zlib1g-dev

      - name: Clone LEDE
        run: |
          git clone --depth=1 \
            https://github.com/coolsnowwolf/lede.git \
            lede

      - name: Update feeds
        working-directory: lede
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Prepare configuration
        working-directory: lede
        run: |
          cp ../.config .config
          make defconfig

          echo "===== Final configuration ====="
          grep -E \
            'CONFIG_TARGET_x86|CONFIG_VMDK_IMAGES|CONFIG_GRUB_IMAGES|CONFIG_LUCI_LANG|CONFIG_PACKAGE_(openvpn|kmod-tun|luci-app-openvpn|luci-app-openvpn-server|openvpn-easy-rsa|openssl-util)' \
            .config || true

      - name: Check OpenVPN configuration
        working-directory: lede
        run: |
          set -e
          echo "===== OpenVPN related packages ====="
          grep -E \
            'CONFIG_PACKAGE_(openvpn|kmod-tun|luci-app-openvpn|luci-app-openvpn-server|openvpn-easy-rsa|openssl-util)' \
            .config || true

          echo
          echo "===== Target configuration ====="
          grep -E \
            'CONFIG_TARGET_x86|CONFIG_VMDK_IMAGES|CONFIG_GRUB_IMAGES' \
            .config || true

      - name: Download sources
        working-directory: lede
        run: |
          make download -j8
          find dl -size -1024c -delete

      - name: Build firmware
        working-directory: lede
        run: |
          set -o pipefail
          make -j"$(nproc)" V=s 2>&1 | tee ../build.log

      - name: List firmware
        working-directory: lede
        run: |
          echo "===== Firmware files ====="
          find bin/targets \
            -type f \
            \( \
              -name "*.vmdk" \
              -o -name "*.img" \
              -o -name "*.iso" \
              -o -name "*.bin" \
              -o -name "*.manifest" \
              -o -name "*.json" \
            \) \
            -print | sort

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: lede-x86-64-vmdk
          path: |
            lede/bin/targets/x86/64/**/*.vmdk
            lede/bin/targets/x86/64/**/*.img
            lede/bin/targets/x86/64/**/*.bin
            lede/bin/targets/x86/64/**/*.manifest
            lede/bin/targets/x86/64/**/*.json
            build.log
          if-no-files-found: error
          retention-days: 7
