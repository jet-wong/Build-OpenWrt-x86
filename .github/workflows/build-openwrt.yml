# ============================================================
# GitHub Actions 编译 OpenWrt（x86/64 / VMDK / OpenVPN + OpenVPN Server / 中文 LuCI）
# 源码：coolsnowwolf/lede（lean）
#
# v4（2026-10-02）：
#   - 加入 OpenVPN Server（luci-app-openvpn-server，lean luci feed 自带）
#   - ** ONLY 手动触发（workflow_dispatch），不自动执行 **
#     （不挂 push / schedule，改配置不会自动跑编译）
#
# 用法：
#   1. 仓库根目录放两个文件：
#        .config                                <- 本配置（openwrt-x86-64-openvpn-server.config 改名）
#        .github/workflows/build-openwrt.yml    <- 本文件
#   2. Actions -> Build OpenWrt x86 VMDK -> Run workflow（手动点）
#   3. 跑完在 Artifacts 里下载 openwrt-x86-64-vmdk
# ============================================================

name: Build OpenWrt x86 VMDK

# 仅手动触发，不自动执行（无 push / schedule）
on:
  workflow_dispatch:
    inputs:
      release:
        description: '同时发布到 Release'
        type: boolean
        default: false
      single_thread:
        description: '单线程编译（报错看不清时勾选，更慢但日志干净）'
        type: boolean
        default: false

permissions:
  contents: write

env:
  TZ: Asia/Shanghai
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master

jobs:
  build:
    runs-on: ubuntu-22.04        # gcc-11，对 OpenWrt 宿主机工具最友好（24.04/26.04 是 gcc-13+，容易把隐式声明当错误）
    timeout-minutes: 350         # 免费版 Linux runner 上限 360 分钟

    steps:

    - name: 检出仓库（含 .config）
      uses: actions/checkout@v7

    - name: 释放磁盘空间
      run: |
        df -h
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                   /opt/hostedtoolcache/CodeQL /usr/lib/jvm /usr/local/share/powershell \
                   /usr/share/swift /usr/local/.ghcup /usr/share/gradle 2>/dev/null || true
        sudo docker image prune -a -f 2>/dev/null || true
        sudo apt-get clean
        echo "--- 清理后可用空间 ---"
        df -h /

    - name: 安装编译依赖
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential asciidoc binutils bzip2 gawk gettext git \
          zlib1g-dev patch python3 python3-distutils unzip \
          lib32gcc-s1 libc6-dev-i386 subversion flex uglifyjs \
          gcc-multilib g++-multilib p7zip p7zip-full msmtp libssl-dev \
          texinfo libglib2.0-dev xmlto qemu-utils libelf-dev \
          autoconf automake libtool autopoint device-tree-compiler \
          gperf wget swig rsync ccache libncurses5-dev libncursesw5-dev
        echo "--- 关键工具版本 ---"
        awk -W version 2>/dev/null | head -1
        gcc --version | head -1

    - name: 恢复缓存（dl 源码包 + ccache）
      uses: actions/cache@v6
      with:
        path: |
          lede/dl
          .ccache
        key: owrt-${{ runner.os }}-${{ hashFiles('.config') }}
        restore-keys: |
          owrt-${{ runner.os }}-

    - name: 克隆源码
      run: git clone --depth 1 "$REPO_URL" -b "$REPO_BRANCH" lede

    - name: 载入配置 + 更新 feeds
      run: |
        cp .config lede/.config
        cd lede
        # ext4 分区必须装得下 rootfs。这套固件 rootfs 未压缩约 300MB，
        # 256MB 会在最后一步 make_ext4fs 报 "out of space"，这里直接留 512MB
        sed -i 's/^CONFIG_TARGET_ROOTFS_PARTSIZE=.*/CONFIG_TARGET_ROOTFS_PARTSIZE=512/' .config
        grep -q '^CONFIG_TARGET_ROOTFS_PARTSIZE=512' .config || echo 'CONFIG_TARGET_ROOTFS_PARTSIZE=512' >> .config
        echo "CONFIG_CCACHE=y" >> .config
        ./scripts/feeds update -a
        ./scripts/feeds install -a
        make defconfig
        echo "=== 生效的目标机型 ==="
        grep -E "^CONFIG_TARGET_(BOARD|SUBTARGET|PROFILE)" .config | head -5
        echo "=== OpenVPN / Server / LuCI 中文 是否真正选中（defconfig 会静默剔除依赖不满足的）==="
        grep -E "^CONFIG_PACKAGE_(openvpn-openssl|luci-app-openvpn|luci-app-openvpn-server|luci-i18n-openvpn-server-zh_Hans|kmod-tun)" .config || echo "!!! 有包未选中，检查包名"

    - name: 下载源码包
      id: download
      run: cd lede && make -j$(nproc) download V=s

    - name: 编译固件
      id: compile
      run: |
        cd lede
        export CCACHE_DIR="$GITHUB_WORKSPACE/.ccache"
        export CCACHE_MAXSIZE=3G
        ccache -z
        if [ "${{ inputs.single_thread }}" = "true" ]; then
          make -j1 V=s
        else
          # 先多线程；失败则单线程重跑一次，报错不会被并行日志冲掉
          make -j$(nproc) V=s || make -j1 V=s
        fi
        ccache -s

    - name: 失败时收集日志
      if: failure()
      run: |
        echo "=== 磁盘 ==="
        df -h /
        echo "=== 最近失败的编译日志 ==="
        cd lede 2>/dev/null || exit 0
        find logs build_dir -name "*.log" -newermt "-20 minutes" 2>/dev/null | head -10
        for f in $(find logs -name "*.log" -newermt "-20 minutes" 2>/dev/null | head -3); do
          echo "----- $f -----"; tail -40 "$f"
        done

    - name: 整理产物
      run: |
        cd lede/bin/targets/x86/64
        echo "=== 镜像 ==="
        ls -lh *.vmdk *.img.gz 2>/dev/null || ls -lh
        echo "=== 打进镜像的 openvpn / luci 相关 ipk ==="
        find packages -iname "*openvpn*" 2>/dev/null | head -10

    - name: 上传固件到 Artifacts
      uses: actions/upload-artifact@v7
      with:
        name: openwrt-x86-64-vmdk
        path: |
          lede/bin/targets/x86/64/*.vmdk
          lede/bin/targets/x86/64/*.img.gz
        compression-level: 0        # 镜像本身已压缩，再压只浪费时间
        retention-days: 30

    - name: 上传 ipk 包（便于核对装了什么）
      uses: actions/upload-artifact@v7
      with:
        name: openwrt-ipk-packages
        path: lede/bin/targets/x86/64/packages/
        compression-level: 9
        retention-days: 30

    - name: 发布到 Release
      if: ${{ github.event_name == 'workflow_dispatch' && inputs.release }}
      uses: softprops/action-gh-release@v3
      with:
        tag_name: openwrt-x86-${{ github.run_number }}
        name: OpenWrt x86 VMDK #${{ github.run_number }}
        body: |
          源码：coolsnowwolf/lede (${{ env.REPO_BRANCH }})
          机型：x86_64 generic
          镜像：ext4 + squashfs，含 VMDK
          插件：OpenVPN + OpenVPN Server + LuCI，中文界面
        files: lede/bin/targets/x86/64/*combined*.vmdk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
