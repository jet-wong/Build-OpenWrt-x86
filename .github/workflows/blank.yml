# ============================================================
# GitHub Actions 自动编译 OpenWrt（x86_64 / VMDK / OpenVPN / 中文 LuCI）
# 源码：coolsnowwolf/lede（lean）
#
# 用法：
#   1. 新建 GitHub 仓库（建议 Public，Actions 免费额度无限）
#   2. 仓库根目录放两个文件：
#        .config                          <- 用 openwrt-x86-mini.config 改名
#        .github/workflows/build-openwrt.yml   <- 本文件
#   3. 进仓库 Actions 页面 -> Build OpenWrt x86 VMDK -> Run workflow
#   4. 跑完在 Artifacts 里下载 openwrt-x86-64-vmdk
# ============================================================

name: Build OpenWrt x86 VMDK

on:
  workflow_dispatch:
    inputs:
      release:
        description: '同时发布到 Release'
        type: boolean
        default: false
  push:
    paths:
      - '.config'
      - '.github/workflows/build-openwrt.yml'
  # 取消注释即可每周日 04:00 (UTC) 自动编译
  # schedule:
  #   - cron: '0 4 * * 0'

permissions:
  contents: write

env:
  TZ: Asia/Shanghai
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350          # 免费版 Linux runner 上限 360 分钟

    steps:

    - name: 检出仓库（含 .config）
      uses: actions/checkout@v4

    - name: 释放磁盘空间
      run: |
        df -h
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                   /opt/hostedtoolcache/CodeQL /usr/lib/jvm /opt/azureshell 2>/dev/null || true
        sudo docker image prune -a -f 2>/dev/null || true
        sudo apt-get clean
        echo "--- 清理后 ---"
        df -h

    - name: 安装编译依赖
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential asciidoc binutils bzip2 gawk gettext git \
          libncurses5-dev libz-dev patch python3 python3-distutils unzip zlib1g-dev \
          lib32gcc-s1 libc6-dev-i386 subversion flex uglifyjs gcc-multilib g++-multilib \
          p7zip p7zip-full msmtp libssl-dev texinfo libglib2.0-dev xmlto qemu-utils upx \
          libelf-dev autoconf automake libtool autopoint device-tree-compiler antlr3 gperf \
          wget swig rsync ccache

    - name: 恢复缓存（dl 源码包 + ccache）
      uses: actions/cache@v4
      with:
        path: |
          lede/dl
          .ccache
        key: owrt-${{ runner.os }}-${{ hashFiles('.config') }}
        restore-keys: |
          owrt-${{ runner.os }}-

    - name: 克隆源码
      run: git clone --depth 1 "$REPO_URL" -b "$REPO_BRANCH" lede

    - name: 载入配置 + 更新 feeds
      run: |
        cp .config lede/.config
        cd lede
        echo "CONFIG_CCACHE=y" >> .config
        ./scripts/feeds update -a
        ./scripts/feeds install -a
        make defconfig

    - name: 下载源码包
      run: cd lede && make -j$(nproc) download V=s

    - name: 编译固件
      run: |
        cd lede
        export CCACHE_DIR="$GITHUB_WORKSPACE/.ccache"
        export CCACHE_MAXSIZE=5G
        ccache -z
        # 先多线程；失败则自动单线程重跑一次（便于看到真实报错）
        make -j$(nproc) V=s || make -j1 V=s
        ccache -s

    - name: 整理产物
      run: |
        cd lede/bin/targets/x86/64
        rm -rf packages
        echo "=== 产物列表 ==="
        ls -lh

    - name: 上传固件到 Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: openwrt-x86-64-vmdk
        path: lede/bin/targets/x86/64/*
        compression-level: 0        # 镜像本身已压缩，再压只浪费时间
        retention-days: 30

    - name: 发布到 Release
      if: ${{ github.event_name == 'workflow_dispatch' && inputs.release }}
      uses: softprops/action-gh-release@v2
      with:
        tag_name: openwrt-x86-${{ github.run_number }}
        name: OpenWrt x86 VMDK #${{ github.run_number }}
        body: |
          源码：coolsnowwolf/lede (${{ env.REPO_BRANCH }})
          机型：x86_64 generic
          镜像：ext4 + squashfs，含 VMDK
          插件：OpenVPN 服务器 + LuCI，中文界面
          编译时间：${{ github.run_id }}
        files: lede/bin/targets/x86/64/*combined*.vmdk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
